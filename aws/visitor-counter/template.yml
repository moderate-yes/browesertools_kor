AWSTemplateFormatVersion: "2010-09-09"
Description: Serverless visitor counter for korean.browsertools.kr

Resources:
  VisitorCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: browsertools-korea-visitors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  VisitorCounterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UpdateVisitorCounter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt VisitorCounterTable.Arn

  VisitorCounterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: browsertools-korea-visitor-counter
      Description: Counts daily and total visits for korean.browsertools.kr
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: 2
      Role: !GetAtt VisitorCounterRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitorCounterTable
          ALLOWED_ORIGIN: https://korean.browsertools.kr
      Code: aws/visitor-counter

  VisitorCounterUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt VisitorCounterFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins:
          - https://korean.browsertools.kr
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 86400

  VisitorCounterUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VisitorCounterFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  VisitorCounterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VisitorCounterFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  VisitorCounterUrl:
    Description: Public visitor counter endpoint
    Value: !GetAtt VisitorCounterUrl.FunctionUrl
