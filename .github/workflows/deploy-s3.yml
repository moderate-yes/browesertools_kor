name: Deploy static site to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::929270557834:role/github-actions-browsertools-korea
  S3_BUCKET: browsertools-korea
  CLOUDFRONT_DISTRIBUTION_ID: ED7SA6PSHLSTR
  INDEXNOW_KEY: a75c6419caef4302bc7c045bc45b49ed
  VISITOR_COUNTER_STACK: browsertools-korea-visitor-counter

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test static site
        run: node --test tests/*.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy visitor counter infrastructure
        run: |
          aws cloudformation package \
            --template-file aws/visitor-counter/template.yml \
            --s3-bucket "${S3_BUCKET}" \
            --s3-prefix infrastructure/visitor-counter \
            --output-template-file /tmp/visitor-counter-packaged.yml
          aws cloudformation deploy \
            --template-file /tmp/visitor-counter-packaged.yml \
            --stack-name "${VISITOR_COUNTER_STACK}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset
          COUNTER_URL="$(aws cloudformation describe-stacks \
            --stack-name "${VISITOR_COUNTER_STACK}" \
            --query 'Stacks[0].Outputs[?OutputKey==`VisitorCounterUrl`].OutputValue' \
            --output text)"
          printf 'window.DANSUM_CONFIG = Object.freeze({\n  visitorCounterUrl: "%s",\n});\n' "${COUNTER_URL}" \
            > static/runtime-config.js

      - name: Upload static assets
        run: |
          aws s3 sync static "s3://${S3_BUCKET}/static" \
            --delete \
            --cache-control "public,max-age=3600" \
            --only-show-errors

      - name: Upload pages and SEO files
        run: |
          aws s3 cp index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp googleab522432670c34d4.html "s3://${S3_BUCKET}/googleab522432670c34d4.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 sync tools "s3://${S3_BUCKET}/tools" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp robots.txt "s3://${S3_BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp sitemap.xml "s3://${S3_BUCKET}/sitemap.xml" \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp "${INDEXNOW_KEY}.txt" "s3://${S3_BUCKET}/${INDEXNOW_KEY}.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Refresh CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"

      - name: Notify Naver and IndexNow search engines
        run: |
          URLS_JSON="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' sitemap.xml | jq -R . | jq -s .)"
          jq -n \
            --arg host "korean.browsertools.kr" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://korean.browsertools.kr/${INDEXNOW_KEY}.txt" \
            --argjson urlList "${URLS_JSON}" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}' \
            > /tmp/indexnow.json
          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            https://searchadvisor.naver.com/indexnow
