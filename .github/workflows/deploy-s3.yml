name: Deploy static site to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::929270557834:role/github-actions-browsertools-korea
  S3_BUCKET: browsertools-korea
  CLOUDFRONT_DISTRIBUTION_ID: ED7SA6PSHLSTR

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static assets
        run: |
          aws s3 sync static "s3://${S3_BUCKET}/static" \
            --delete \
            --cache-control "public,max-age=3600" \
            --only-show-errors

      - name: Upload pages and SEO files
        run: |
          aws s3 cp index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 sync tools "s3://${S3_BUCKET}/tools" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp robots.txt "s3://${S3_BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp sitemap.xml "s3://${S3_BUCKET}/sitemap.xml" \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Refresh CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"
