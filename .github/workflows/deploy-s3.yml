name: Deploy static site to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::929270557834:role/github-actions-browsertools-korea
  S3_BUCKET: browsertools-korea
  CLOUDFRONT_DISTRIBUTION_ID: ED7SA6PSHLSTR
  INDEXNOW_KEY: a75c6419caef4302bc7c045bc45b49ed

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static assets
        run: |
          aws s3 sync static "s3://${S3_BUCKET}/static" \
            --delete \
            --cache-control "public,max-age=3600" \
            --only-show-errors

      - name: Upload pages and SEO files
        run: |
          aws s3 cp index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp favicon.ico "s3://${S3_BUCKET}/favicon.ico" \
            --content-type "image/x-icon" \
            --cache-control "public,max-age=86400" \
            --only-show-errors
          aws s3 cp favicon-48x48.png "s3://${S3_BUCKET}/favicon-48x48.png" \
            --content-type "image/png" \
            --cache-control "public,max-age=86400" \
            --only-show-errors
          aws s3 cp googleab522432670c34d4.html "s3://${S3_BUCKET}/googleab522432670c34d4.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 sync tools "s3://${S3_BUCKET}/tools" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp robots.txt "s3://${S3_BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp sitemap.xml "s3://${S3_BUCKET}/sitemap.xml" \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp ads.txt "s3://${S3_BUCKET}/ads.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp "${INDEXNOW_KEY}.txt" "s3://${S3_BUCKET}/${INDEXNOW_KEY}.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Refresh CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"

      - name: Notify Naver and IndexNow search engines
        continue-on-error: true
        run: |
          URLS_JSON="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' sitemap.xml | jq -R . | jq -s .)"
          jq -n \
            --arg host "browsertools.kr" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://browsertools.kr/${INDEXNOW_KEY}.txt" \
            --argjson urlList "${URLS_JSON}" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}' \
            > /tmp/indexnow.json
          curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 30 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            https://searchadvisor.naver.com/indexnow
